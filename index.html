<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aortico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --background: #171717;
      --header: #1d1d1d;
      --text: #eeeeec;
      --teal: #74C7C4;
      --yellow: #F6BC48;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);

      font-family: "Montserrat", sans-serif;
      font-weight: 500;

      -webkit-font-smoothing: antialiased;
    }


    /* =============================
       HEADER
    ============================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 68px;

      background: var(--header);
    }

    .header-inner {
      width: calc(100% - 48px);
      height: 100%;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      width: 185px;
      height: auto;
      display: block;
    }

    .learn-more {
      color: var(--text);

      text-decoration: none;

      font-size: 0.88rem;
      font-weight: 700;

      letter-spacing: 0.02em;
    }

    .learn-more:hover {
      color: var(--teal);
    }


    /* =============================
       HERO
    ============================= */

    .hero {
      min-height: calc(100vh - 68px);

      display: flex;
      align-items: center;
    }

    .hero-inner {
      width: min(calc(100% - 80px), 1005px);

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        minmax(0, 1.25fr)
        minmax(300px, 0.75fr);

      align-items: center;

      gap: 45px;
    }


    /* LEFT */

    .hero-copy {
      max-width: 670px;
    }

    .eyebrow {
      margin: 0 0 18px;

      font-size: 0.85rem;
      font-weight: 500;

      letter-spacing: 0;
    }

    h1 {
      margin: 0;

      font-size: clamp(3rem, 4.8vw, 4.2rem);

      font-weight: 700;

      line-height: 1.04;

      letter-spacing: -0.045em;
    }

    .yellow-line {
      width: 40px;
      height: 2px;

      margin: 24px 0 17px;

      background: var(--yellow);
    }

    .description {
      max-width: 650px;

      margin: 0;

      font-size: 0.95rem;
      font-weight: 500;

      line-height: 1.15;
    }


    /* RIGHT */

    .hero-image-wrap {
      height: min(76vh, 590px);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-image {
      width: 100%;
      height: 100%;

      object-fit: contain;
    }


    /* =============================
       MOBILE
    ============================= */

    @media (max-width: 760px) {

      header {
        height: 64px;
      }

      .header-inner {
        width: calc(100% - 30px);
      }

      .logo {
        width: 145px;
      }

      .learn-more {
        font-size: 0.7rem;
      }

      .hero {
        min-height: auto;

        padding: 55px 0 30px;
      }

      .hero-inner {
        width: calc(100% - 40px);

        grid-template-columns: 1fr;

        gap: 30px;
      }

      .eyebrow {
        font-size: 0.72rem;
      }

      h1 {
        font-size: clamp(2.5rem, 11vw, 3.7rem);
      }

      .description {
        font-size: 0.88rem;
        line-height: 1.35;
      }

      .hero-image-wrap {
        height: 390px;
      }

      .hero-image {
        max-width: 360px;
        margin: 0 auto;
      }

    }

  </style>

</head>

<body>


  <header>

    <div class="header-inner">

      <a href="#" aria-label="Aortico home">

        <img
          src="./aortico-logo.svg"
          alt="Aortico"
          class="logo"
        >

      </a>


      <a
        href="mailto:info@aortico.com"
        class="learn-more"
      >
        LEARN MORE
      </a>

    </div>

  </header>



  <main class="hero">

    <div class="hero-inner">


      <div class="hero-copy">

        <p class="eyebrow">
          BEYOND SIZE. TOWARD STRENGTH.
        </p>


        <h1>
          Detect Aortic Fragility<br>
          Before Dissection
        </h1>


        <div class="yellow-line"></div>


        <p class="description">
          AI-driven patient-specific assessment of aortic wall mechanics from imaging.<br>
          Deeper insight for earlier, more confident treatment decisions.
        </p>

      </div>



      <div class="hero-image-wrap">

        <img
          src="./assets/medical/aorta-hero.png"
          alt="Aorta with biomechanical mesh overlay"
          class="hero-image"
        >

      </div>


    </div>

  </main>


</body>
</html>
